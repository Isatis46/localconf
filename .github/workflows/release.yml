name: Publish portable Windows preview

on:
  push:
    tags:
      - 'v0.1.0-preview.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v0.1.0-preview.')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LOCALCONF_BUILD_ROOT: ${{ runner.temp }}/localconf-build
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build with verified Windows 7 compatible toolchains
        shell: bash
        run: bash build/setup-linux.sh

      - name: Verify client networking and server behavior
        shell: bash
        run: |
          set -euo pipefail
          npm test
          export GOPATH="$LOCALCONF_BUILD_ROOT/.gopath"
          export GOCACHE="$LOCALCONF_BUILD_ROOT/.gocache"
          cd src/server
          "$LOCALCONF_BUILD_ROOT/toolchains/go/bin/go" test -race ./...

      - name: Create source archive and checksum list
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=LocalConf-0.1.0-source/ \
            --output=artifacts/LocalConf-0.1.0-source.zip HEAD
          cd artifacts
          sha256sum LocalConf-0.1.0-win-x64.zip LocalConf-0.1.0-source.zip > SHA256SUMS.txt

      - name: Publish prerelease and attach executable and source bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'This tag already has a release. Refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/LocalConf-0.1.0-win-x64.zip \
            artifacts/LocalConf-0.1.0-source.zip \
            artifacts/LocalConf-0.1.0-win-x64.zip.sha256 \
            artifacts/SHA256SUMS.txt \
            --verify-tag --prerelease \
            --title "LocalConf 0.1.0 — Windows portable preview" \
            --notes-file docs/release-notes-0.1.0.md
